  else if (u.downloading) { st.className = 'status-line new'; st.innerHTML = '<span class="spinner"></span> ' + esc(statusText); }
  else if (u.status) { st.className = 'status-line ' + u.status.kind; st.textContent = statusText; }
  else { st.className = 'status-line'; st.textContent = ''; }
  const row = $('updActions');
  row.innerHTML = '';
  const busy = u.checking || u.downloading;
  if (a) {
    row.appendChild(actionButton(t('btnSkip'), 'btn-ghost', () => { send('update_skip'); closeModal('updateModal'); }, busy));
    row.appendChild(actionButton(t('btnLater'), 'btn-ghost', () => closeModal('updateModal'), u.downloading));
    if (canUpdate && u.writable) row.appendChild(actionButton(t('btnInstall'), 'btn-primary', () => send('update_install'), busy));
    else row.appendChild(actionButton(t('btnPage'), 'btn-primary', () => send('update_page')));
  } else {
    row.appendChild(actionButton(t('btnAll'), 'btn-ghost', () => send('update_page')));
    row.appendChild(actionButton(t('btnUpdCheck'), 'btn-primary', () => send('update_check'), busy || !canUpdate));
  }
}

// ============================================================ keyboard
// Roving tabindex of the radio groups: the checked option, or the first enabled one, is the tab stop.
function roveGroup(g) {
  const items = [...g.querySelectorAll('[role=radio]')];
  const stop = items.find(i => i.getAttribute('aria-checked') === 'true' && !i.disabled) || items.find(i => !i.disabled);
  items.forEach(i => { i.tabIndex = i === stop ? 0 : -1; });
}
function roveAll() { document.querySelectorAll('[role=radiogroup]').forEach(roveGroup); }
// Arrow keys: next or previous option that is not disabled; selecting is a click, as with the mouse
document.addEventListener('keydown', e => {
  const g = e.target.closest && e.target.closest('[role=radiogroup]');
  if (g && e.target.getAttribute('role') === 'radio' && ['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp'].includes(e.key)) {
    const items = [...g.querySelectorAll('[role=radio]')].filter(i => !i.disabled);
    const k = items.indexOf(e.target);
    if (k < 0 || items.length < 2) return;
    e.preventDefault();
    const next = items[(k + (e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length];
    const gid = g.id, idx = [...g.querySelectorAll('[role=radio]')].indexOf(next);
    next.click();
    const again = $(gid).querySelectorAll('[role=radio]')[idx];
    if (again) again.focus();
    return;
  }
  const tabs = e.target.closest && e.target.closest('[role=tablist]');
  if (tabs && e.target.getAttribute('role') === 'tab' && ['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(e.key)) {
    const items = [...tabs.querySelectorAll('[role=tab]')];
    const k = items.indexOf(e.target);
    const j = e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : (k + (e.key === 'ArrowRight' ? 1 : items.length - 1)) % items.length;
    e.preventDefault();
    showTab(items[j].dataset.tab);
    items[j].focus();
    return;
  }
  if (e.target.getAttribute && e.target.getAttribute('role') === 'option' && ['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key)) {
    const k = disks.findIndex(d => d.id === e.target.dataset.id);
    if (k < 0) return;
    const j = e.key === 'Home' ? 0 : e.key === 'End' ? disks.length - 1 : Math.max(0, Math.min(disks.length - 1, k + (e.key === 'ArrowDown' ? 1 : -1)));
    e.preventDefault();
    selectDrive(disks[j].id);
    renderAll();
    const o = [...$('driveList').children].find(x => x.dataset.id === disks[j].id);
    if (o) { o.focus(); o.scrollIntoView({ block: 'nearest' }); }
    return;
  }
  if (e.key === 'Tab') {
    const m = topModal();
    if (!m) return;
    const f = [...m.querySelectorAll('button, input, select, a[href], [tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (!m.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if (e.key === 'Escape') {
    const m = topModal();
    if (m) { closeModal(m.id); return; }
    const ts = $('toasts').lastElementChild;
    if (ts) ts.remove();
  }
});
$('titlebar').addEventListener('mousedown', e => {
  if (platform !== 'macos' || e.button !== 0) return;
  if (e.target.closest('button, select, input')) return;
  send('drag');
});
setInterval(() => { if (task) renderProgress(); }, 1000);

lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
if (!I18N[lang]) lang = 'en';
systemLang = lang;
applyLanguage();
send('ready');
</script>
