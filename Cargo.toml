[package]
name = "usbmemorychecker"
version = "0.1.2"
edition = "2024"
authors = ["DeMoZ"]
description = "Checks USB flash drives and memory cards: read/write speed, real capacity (fake drive detection) and repair to the real size"
repository = "https://github.com/DeMoZ/UsbMemoryChecker"
license = "MIT"
publish = false

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sys-locale = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
